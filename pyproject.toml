[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "A lightweight, dependency-free harness for scoring RAG retrieval quality and flagging likely hallucinations against a labeled test set."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Juveriya Khatri", email = "juveriya.khatri@example.com" }]
keywords = ["rag", "evaluation", "retrieval", "hallucination", "llm", "verification", "bm25"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2.0"]
llm = ["httpx>=0.24"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["sentence-transformers>=2.2.0", "httpx>=0.24", "pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
ragval = "ragval.cli:main"

[project.urls]
Homepage = "https://github.com/juveriyakhatri/rag-eval-harness"
Issues = "https://github.com/juveriyakhatri/rag-eval-harness/issues"

[tool.setuptools.packages.find]
include = ["ragval*"]

[tool.setuptools.package-data]
ragval = ["data/*.jsonl", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ragval"]
omit = ["ragval/plugins/*"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q --cov=ragval --cov-report=term-missing

  evaluate:
    name: RAG quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .

      # The gate is the point of the project: retrieval quality and
      # hallucination detection are treated as build-breaking properties,
      # exactly like a failing unit test.
      - name: Evaluate and gate
        run: |
          ragval run \
            --dataset bundled \
            --k 1,3,5,10 \
            --json out/results.json \
            --html out/report.html \
            --junit out/junit.xml \
            --config ragval.config.json \
            --baseline baseline.json \
            --fail-under-gate \
            --no-color

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: out/
          retention-days: 30

      - name: Summarise in the job page
        if: always()
        run: |
          {
            echo "## RAG evaluation"
            echo '```'
            python -c "import json;d=json.load(open('out/results.json'));r=d['retrieval'];g=d.get('detector',{});print(f\"recall@5   {r['recall@5']:.3f}\");print(f\"nDCG@5     {r['ndcg@5']:.3f}\");print(f\"MRR        {r['mrr']:.3f}\");print(f\"detector F1 {g.get('f1',0):.3f}\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
